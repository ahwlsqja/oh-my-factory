name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not report security problems here.** Use the Security tab instead.

        Before you paste anything, mask file paths that contain your user name and any e-mail addresses.
        Never paste a token or other credential.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. omf init ...\n2. ..."
    validations:
      required: true
  - type: input
    id: omf-version
    attributes:
      label: Output of `omf --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: macOS 15, Ubuntu 24.04, ...
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Output of `node --version`
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `omf doctor --json`
      description: |
        Redact it first: replace absolute paths (they contain your user name) and any e-mail address
        with placeholders such as `/home/USER/...`.
      render: json
    validations:
      required: true
  - type: textarea
    id: implementation-contract
    attributes:
      label: Implementation contract (maintainers complete before Ready)
      description: |
        Optional for reporters. Follow docs/maintainers/development-workflow.md when picking up the fix.
        Link the parent goal or name the invariant/scenario; do not invent a numeric KPI.
      value: |
        State: Backlog

        ## Problem / goal and contribution evidence

        ## Scope and non-goals

        ## Acceptance
        - [ ]

        ## Validation

        ## Context
        Owner, design/related links, dependencies, risks and unresolved decisions (or none).
  - type: textarea
    id: extra
    attributes:
      label: Anything else
