name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        OMF is pre-alpha and its behavior follows the documents in `docs/design`. Please check them
        first; a change to the design starts as a discussion here.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: implementation-contract
    attributes:
      label: Implementation contract (maintainers complete before Ready)
      description: |
        Optional when proposing an idea. Follow docs/maintainers/development-workflow.md before implementation.
        Link the parent goal or name the invariant/scenario; do not invent a numeric KPI.
      value: |
        State: Backlog

        ## Problem / goal and contribution evidence

        ## Scope and non-goals

        ## Acceptance
        - [ ]

        ## Validation

        ## Context
        Owner, design/related links, dependencies, risks and unresolved decisions (or none).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: scope
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the design documents.
          required: true
